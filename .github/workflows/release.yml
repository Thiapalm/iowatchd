name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, arch: x86_64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches the packaged versions
        run: scripts/check-versions.sh "$GITHUB_REF_NAME"
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (static binary, man pages, completions, init files)
        run: |
          name="iowatchd-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          scripts/make-tarball.sh "$name" target/${{ matrix.target }}/release/iowatchd
      - name: Smoke-test the tarball
        run: REQUIRE_STATIC=1 scripts/check-tarball.sh iowatchd-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: iowatchd-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "iowatchd $GITHUB_REF_NAME" --generate-notes iowatchd-*

  publish-crate:
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (only when the token secret is set)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
