name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: make
      - name: Staged install smoke test
        run: |
          make install DESTDIR="$PWD/stage" PREFIX=/usr
          test -x stage/usr/bin/iowatchd
          make uninstall DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Syntax of scripts and completions
        run: |
          bash -n install.sh iowatchd-log iowatchd-notify completions/iowatchd.bash
          sudo apt-get install -y zsh shellcheck >/dev/null
          zsh -n completions/_iowatchd
          shellcheck -S warning iowatchd-log iowatchd-notify scripts/*.sh
      - name: Release versions are consistent
        run: scripts/check-versions.sh
      - name: Logrotate config and systemd unit
        run: |
          sudo make install PREFIX=/usr/local
          logrotate -d packaging/logrotate/iowatchd
          systemd-analyze verify /etc/systemd/system/iowatchd.service

  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked

  deb:
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - run: apt-get update && apt-get install -y build-essential debhelper cargo git
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          dpkg-deb -c ../iowatchd_*.deb
      - name: Install the .deb and lint it
        run: |
          apt-get install -y ../iowatchd_*.deb lintian
          iowatchd --version
          test -f /etc/iowatchd.conf
          lintian --fail-on error ../iowatchd_*.changes

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y rpm-build cargo make systemd-rpm-macros git tar gzip
      - uses: actions/checkout@v4
      - name: Build the .rpm
        run: |
          git config --global --add safe.directory "$PWD"
          ver=$(awk '/^Version:/ {print $2}' packaging/rpm/iowatchd.spec)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="iowatchd-$ver/" -o ~/rpmbuild/SOURCES/iowatchd-$ver.tar.gz HEAD
          rpmbuild -ba packaging/rpm/iowatchd.spec
          rpm -qlp ~/rpmbuild/RPMS/*/iowatchd-*.rpm
      - name: Install the .rpm and lint it
        run: |
          dnf install -y ~/rpmbuild/RPMS/*/iowatchd-*.rpm rpmlint
          iowatchd --version
          test -f /etc/iowatchd.conf
          rpmlint ~/rpmbuild/RPMS/*/iowatchd-*.rpm || true

  tarball:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, arch: x86_64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build and smoke-test the release tarball
        run: |
          name="iowatchd-vci-linux-${{ matrix.arch }}"
          scripts/make-tarball.sh "$name" target/${{ matrix.target }}/release/iowatchd
          REQUIRE_STATIC=1 scripts/check-tarball.sh "$name.tar.gz"

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git namcap cargo
      - uses: actions/checkout@v4
      - name: Build the source package (PKGBUILD)
        run: |
          git config --global --add safe.directory "$PWD"
          useradd -m builder
          ver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          dir=/home/builder/pkg
          mkdir -p "$dir"
          git archive --prefix="iowatchd-$ver/" -o "$dir/iowatchd-$ver.tar.gz" HEAD
          # Use the local archive instead of the not-yet-existing release tag
          sed 's|^source=.*|source=("$pkgname-$pkgver.tar.gz")|' packaging/arch/PKGBUILD > "$dir/PKGBUILD"
          chown -R builder "$dir"
          cd "$dir"
          su builder -c "makepkg --noconfirm --skipchecksums"
          namcap PKGBUILD
          namcap iowatchd-*.pkg.tar.zst || true
          pacman -U --noconfirm iowatchd-*.pkg.tar.zst
          iowatchd --version

  arch-bin:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git namcap
      - uses: actions/checkout@v4
      - name: Verify the released assets and checksums (PKGBUILD)
        run: |
          useradd -m builder
          mkdir /home/builder/pkg
          cp packaging/arch-bin/PKGBUILD /home/builder/pkg/
          chown -R builder /home/builder/pkg
          cd /home/builder/pkg
          su builder -c "makepkg --noconfirm"
          namcap PKGBUILD
          pacman -U --noconfirm iowatchd-bin-*.pkg.tar.zst
          iowatchd --version

  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Audit, install and test the formula
        run: |
          brew tap-new local/iowatchd
          cp packaging/homebrew/iowatchd.rb "$(brew --repository local/iowatchd)/Formula/"
          brew style local/iowatchd
          brew audit --strict local/iowatchd/iowatchd
          brew install local/iowatchd/iowatchd
          brew test local/iowatchd/iowatchd
