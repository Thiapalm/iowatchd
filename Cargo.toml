[package]
name = "iowatchd"
version = "0.3.1"
edition = "2021"
description = "Monitors disk IO usage and logs which processes are consuming it"
license = "MIT"
repository = "https://github.com/Thiapalm/iowatchd"
homepage = "https://github.com/Thiapalm/iowatchd"
readme = "README.md"
keywords = ["io", "disk", "monitoring", "linux", "daemon"]
categories = ["command-line-utilities", "os::linux-apis"]
rust-version = "1.75"
exclude = [".github/", "packaging/", "init/"]

# No external dependencies: small binary, offline builds and low resource usage.

[profile.release]
opt-level = "s"     # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
