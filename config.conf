# Configuracao do iowatchd (formato chave=valor, '#' inicia comentario).
# Instalado em /etc/iowatchd.conf. Todas as chaves sao opcionais.

# Dispositivo de bloco a monitorar (nome em /proc/diskstats, ex.: sda, nvme0n1).
# "auto" detecta o disco fisico onde esta a particao raiz (/).
device = auto

# Limite (%) de uso de IO acima do qual os processos sao registrados.
threshold = 80

# Limite (%) abaixo do qual o IO e considerado normalizado (histerese).
clear_threshold = 70

# Intervalo entre amostras, em segundos.
interval = 2

# Amostras consecutivas acima do limite antes de disparar (evita picos curtos).
trigger_samples = 2

# Janela (segundos) usada para medir o IO por processo quando o limite estoura.
process_window = 1

# Quantidade de processos listados em cada registro.
top_n = 5

# Intervalo minimo (segundos) entre registros enquanto o IO continua alto.
cooldown = 10

# Arquivo de log (alem do journald). Deixe vazio para desativar.
log_file = /var/log/iowatchd.log

# Tamanho maximo (MB) do arquivo antes de rotacionar para <arquivo>.1.
log_max_mb = 5
